<html>
    <head>
        <title>Century Drill Calculator</title>
        <link rel="stylesheet" type="text/css" href="century_calculator.css">
    </head>
    <body onload="popCurrentDate()" class="body">
        <div class="form-container">
            <table class="outer-table">
                <tr>
                    <td>
                        <p class="form-title">When will I finish?</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="start_date" class="form-item">Start Date:</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <span id="start_date_fed_error" style="color: red;" class="form-item"></span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="date" name="start_date_fed" id="start_date_fed" required pattern="\d{4}-\d{2}-\d{2}" oninput="toggle_SD_FED_Error();validateEndDateForm();" value=""></input>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="number_of_days" class="form-item">Number of Days:</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <span id="number_of_days_error" style="color: red;" class="form-item"></span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="number" name="number_of_days" id="number_of_days" required pattern="\d+" oninput="toggle_SD_ND_Error();validateEndDateForm();" value="100"></input>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button id="calculate_end_date" class="form-item" disabled type="submit" onclick="findEndDate();">Calculate</button>
                    </td>
                </tr>
                <tr>
                    <table class="nested-table">
                        <tr>
                            <td style="width: 50%;">
                                <span id="end_date_label" class="form-item">End Date:</span>
                            </td>
                            <td>
                                <span id="end_date" class="form-item"></span>
                            </td>
                        </tr>
                    </table>
                </tr>
            </table>
            <br>
            <br>
            <table class="outer-table">
                <tr>
                    <td>
                        <p class="form-title">What day am I on?</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="start_date" class="form-item">Start Date:</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <span id="start_date_fdn_error" style="color: red;" class="form-item"></span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="date" name="start_date_fdn" id="start_date_fdn" required pattern="\d{4}-\d{2}-\d{2}" oninput="validateDayNumberForm();" value=""></input>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="current_date" class="form-item">Current Date:</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <span id="current_date_error" class="form-item" style="color: red;"></span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input id="current_date" type="date" name="current_date"  required pattern="\d{4}-\d{2}-\d{2}" oninput="validateDayNumberForm();" value=""></input>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button id="calculate_day_number" class="form-item" type="submit" onclick="findWhatDayImOn();">Calculate</button>
                    </td>
                </tr>
                <tr>
                    <table class="nested-table">
                        <tr>
                            <td style="width: 50%;">
                                <span id="day_number_label" class="form-item">Day:</span>
                            </td>
                            <td style="width: 50%;">
                                <span id="day_number" class="form-item"></span>
                            </td>
                        </tr>
                    </table>
                </tr>
            </table>
        </div>
    <script src="century_calculator.js"></script>
    </body>
</html>
